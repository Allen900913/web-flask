name: Lighthouse CI Performance Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nevertellyou
          MYSQL_DATABASE: myblog_db
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pnevertellyou"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmariadb-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -pnevertellyou --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Setup Node.js (for Lighthouse)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Start Flask server
        run: |
          export MYSQL_HOST=127.0.0.1
          export MYSQL_DB=myblog_db
          export MYSQL_USER=root
          export MYSQL_PWD=nevertellyou
          python main.py > flask.log 2>&1 &
          echo $! > flask.pid
          sleep 15
          
      - name: Check if Flask is running
        run: |
          curl -f http://localhost:8080 || (cat flask.log && exit 1)

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop Flask server
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill $(cat flask.pid) || true
          fi

      - name: Show Flask logs on failure
        if: failure()
        run: |
          echo "=== Flask Logs ==="
          cat flask.log || echo "No flask.log found"