version: '3.8'
name: myblog-test-environment

services:
  myblog_server:
    build: .
    image: myblog_test:latest
    container_name: myblog_server_test
    ports:
      - "82:8080"
    environment:
      MYSQL_HOST: mysql_server
      MYSQL_DB: myblog_db
      MYSQL_USER: root
      MYSQL_PWD: nevertellyou
    volumes:
      - myblog_data:/opt/myblog/data
    depends_on:
      mysql_server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - myblog_network

  mysql_server:
    image: mysql:8.0
    container_name: mysql_server_test
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: nevertellyou
      MYSQL_DATABASE: myblog_db
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnevertellyou"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - myblog_network

volumes:
  myblog_data:
  mysql_data:

networks:
  myblog_network:
    driver: bridge